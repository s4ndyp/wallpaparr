<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="Wallpaparr — wallpapers centraal opslaan, taggen en filteren.">
  <title>Wallpaparr</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d12'/%3E%3Cpath d='M6 21l6-7 4 5 3-4 7 6z' fill='%237aa2f7'/%3E%3Ccircle cx='21' cy='10' r='3' fill='%23f7c948'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#12151d"/>
        <path d="M5 22l6.5-7.5L16 19l3.5-4.5L27 22z" fill="#7aa2f7"/>
        <circle cx="21.5" cy="10" r="3" fill="#f7c948"/>
      </svg>
      <div>
        <h1>Wallpaparr</h1>
        <p class="sub"><span id="count">–</span> wallpapers &middot; <span id="tagcount">0</span> tags</p>
      </div>
    </div>
    <div class="actions">
      <button id="pick" class="btn primary">Uploaden</button>
      <input id="file" type="file" accept="image/*" multiple hidden>
      <button id="refresh" class="btn" title="Verversen">Verversen</button>
    </div>
  </header>

  <section class="bar">
    <input id="search" class="input" type="search" placeholder="Zoek op titel of tag…">
    <select id="sort" class="input sort">
      <option value="-created">Nieuwste eerst</option>
      <option value="created">Oudste eerst</option>
      <option value="title">Titel (A-Z)</option>
      <option value="-width">Breedste eerst</option>
    </select>
  </section>

  <nav id="tags" class="tags"></nav>

  <div id="bulk" class="bulk hidden">
    <span><b id="selcount">0</b> geselecteerd</span>
    <input id="bulktag" class="input" placeholder="tag toevoegen…">
    <button id="applytag" class="btn">Tag toepassen</button>
    <button id="delsel" class="btn danger">Verwijderen</button>
    <button id="clearsel" class="btn">Selectie wissen</button>
  </div>

  <main id="grid" class="grid"></main>
  <p id="empty" class="empty hidden">Nog geen wallpapers. Klik op <b>Uploaden</b> om te beginnen.</p>

  <div id="drop" class="drop hidden"><div>Laat los om te uploaden</div></div>
  <div id="toasts" class="toasts"></div>

  <script src="/app.js"></script>
</body>
</html>
