name: build

on:
  push:
    branches: [main, beta]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  server:
    name: server-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🏷️ Image-tags bepalen
        id: tag
        run: |
          BASE="ghcr.io/${{ github.repository }}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # twee tags: de versie én latest (multiline-output vereist een delimiter)
            {
              echo "tags<<EOF"
              echo "$BASE:${GITHUB_REF_NAME}"
              echo "$BASE:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "tags=$BASE:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$BASE:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Server-image bouwen en pushen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.tag.outputs.tags }}

  client:
    name: client-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: ".exe", gui: "0", suffix: "" }
          - { goos: windows, goarch: amd64, ext: ".exe", gui: "1", suffix: "-tray" }
          - { goos: windows, goarch: arm64, ext: ".exe", gui: "0", suffix: "" }
          - { goos: windows, goarch: arm64, ext: ".exe", gui: "1", suffix: "-tray" }
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.mod

      - name: 🔍 Vetten
        working-directory: client
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go vet ./...

      - name: 🏗️ Client bouwen
        working-directory: client
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          GUI: ${{ matrix.gui }}
        run: |
          mkdir -p dist
          # de tray-variant krijgt geen consolevenster (-H=windowsgui)
          LDFLAGS="-s -w"
          if [ "$GUI" = "1" ]; then LDFLAGS="-s -w -H=windowsgui"; fi
          go build -trimpath -ldflags "$LDFLAGS" \
            -o "dist/wallpaparr-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}${{ matrix.ext }}" .

      - uses: actions/upload-artifact@v4
        with:
          name: wallpaparr-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
          path: client/dist/*
          if-no-files-found: error

  ui-test:
    name: ui-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 📦 jsdom installeren
        run: npm install --no-audit --no-fund
      - name: 🧪 Web-UI doortesten (jsdom)
        run: |
          node tests/ui-test.mjs
          node tests/ratio-test.mjs
          node tests/taghelp-test.mjs
          node tests/screens-test.mjs
          node tests/export-test.mjs

  client-test:
    name: client-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
      - name: 🧪 Go-tests (keuze-logica, filters)
        working-directory: client
        run: go test ./...

  release:
    name: release
    needs: [server, client, ui-test, client-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
